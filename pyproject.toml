[project]
name = "tap-snapchat-ads"
version = "0.0.1"
description = "`tap-snapchat-ads` is a Singer tap for SnapchatAds, built with the Meltano Singer SDK."
authors = [{ name = "Gary James" }]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = [
    "ELT",
    "SnapchatAds",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.34.2,<3",
    "pytz",
    "singer-sdk~=0.54.9",
]

[project.optional-dependencies]
s3 = ["fs-s3fs>=1.1.1,<2"]

[project.scripts]
tap-snapchat-ads = "tap_snapchat_ads.tap:TapSnapchatAds.cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "tox>=4.67.1,<5",
    "flake8>=7.4.1,<8",
    "black>=26.10.1,<27",
    "pydocstyle>=6.3.0,<7",
    "mypy>=2.4.0,<2.5",
    "types-requests>=2.33.0.20261006,<3",
    "isort>=9.0.2,<10",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1,<2"]

[tool.isort]
profile = "black"
multi_line_output = 3 # Vertical Hanging Indent
src_paths = "tap_snapchat_ads"

[tool.pydocstyle]
ignore = "D105,D203,D213"

[tool.tox]
requires = [
    "tox>=4.53",
    "tox-uv>=1.35",
]
env_list = [
    { prefix = "3.", start = 11 },
]

[tool.tox.env_run_base]
description = "run tests on Python {env_name}"
runner = "uv-venv-lock-runner"
pass_env = [
    "CI",
    "GITHUB_*",
    "TAP_SNAPCHAT_ADS_*",
]
dependency_groups = [ "dev" ]
commands = [ [ "pytest", { replace = "posargs", default = [ "tap_snapchat_ads/tests" ], extend = true } ] ]
